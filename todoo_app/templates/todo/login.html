<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boss Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center">

    <div class="bg-slate-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-slate-700">
        <h1 class="text-3xl font-extrabold text-center mb-6 text-indigo-400">VIP Login 🚪</h1>
        
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            
            <!-- Django built-in form fields -->
            <div class="space-y-2 text-slate-300">
                {{ form.as_p }}
            </div>

            <button type="submit" 
                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2 rounded-lg transition duration-200">
                Log In
            </button>
        </form>
        <p class="mt-5 text-center text-sm text-slate-300">
            New here? <a href="{% url 'signup' %}" class="text-indigo-400 hover:text-indigo-300">Create an account</a>
        </p>
    </div>

</body>
</html>
